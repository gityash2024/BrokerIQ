# Local development database (the API and web run with pnpm dev).
#   docker compose up -d
name: brokeriq

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: brokeriq
      POSTGRES_PASSWORD: brokeriq
      POSTGRES_DB: brokeriq
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U brokeriq']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
