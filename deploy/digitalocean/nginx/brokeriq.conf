# BrokerIQ — website (:3101) and API (:3100). Installed as a symlink:
#   /etc/nginx/sites-enabled/brokeriq -> /opt/brokeriq/nginx/brokeriq.conf
server {
    listen 80;
    server_name brokeriq.mymultimeds.com brokeriqapi.mymultimeds.com;
    location ^~ /.well-known/acme-challenge/ { root /opt/brokeriq/nginx/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name brokeriqapi.mymultimeds.com;
    ssl_certificate /etc/letsencrypt/live/brokeriq.mymultimeds.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brokeriq.mymultimeds.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    include /opt/brokeriq/nginx/cloudflare-realip.conf;

    access_log /opt/brokeriq/logs/nginx-api.access.log;
    error_log /opt/brokeriq/logs/nginx-api.error.log warn;

    # Media uploads go straight to the API (it enforces per-type limits: 20MB image, 100MB video).
    client_max_body_size 110m;
    proxy_request_buffering off;

    location ^~ /.well-known/acme-challenge/ { root /opt/brokeriq/nginx/acme; }
    location / {
        proxy_pass http://127.0.0.1:3100;
        include /opt/brokeriq/nginx/proxy.conf;
    }
}

server {
    listen 443 ssl;
    server_name brokeriq.mymultimeds.com;
    ssl_certificate /etc/letsencrypt/live/brokeriq.mymultimeds.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brokeriq.mymultimeds.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    include /opt/brokeriq/nginx/cloudflare-realip.conf;

    access_log /opt/brokeriq/logs/nginx-web.access.log;
    error_log /opt/brokeriq/logs/nginx-web.error.log warn;
    client_max_body_size 20m;

    location ^~ /.well-known/acme-challenge/ { root /opt/brokeriq/nginx/acme; }
    location / {
        proxy_pass http://127.0.0.1:3101;
        include /opt/brokeriq/nginx/proxy.conf;
    }
}
