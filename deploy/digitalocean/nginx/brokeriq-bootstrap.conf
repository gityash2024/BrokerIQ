# Phase 1 (before Let's Encrypt certs exist): answer ACME challenges on both domains.
# 443 uses the snakeoil cert only so Cloudflare (Full SSL) can reach the challenge too.
server {
    listen 80;
    listen 443 ssl;
    server_name brokeriq.mymultimeds.com brokeriqapi.mymultimeds.com;
    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    location ^~ /.well-known/acme-challenge/ { root /opt/brokeriq/nginx/acme; }
    location / { return 503; }
}
